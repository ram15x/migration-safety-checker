[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "migration-safety-checker"
version = "0.2.0"
description = "Test that old and new application versions both work against every database state of a rolling deploy."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "psycopg[binary]>=3.1",
  "pyyaml>=6",
  "typer>=0.12",
  "rich>=13",
]

[project.optional-dependencies]
dev = ["pytest>=8", "alembic>=1.13", "sqlalchemy>=2"]

[project.scripts]
migration-safety-checker = "migration_safety_checker.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
