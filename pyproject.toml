[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "releasecompat"
version = "0.1.0"
description = "Test that old and new application versions both work against every database state of a rolling deploy."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "psycopg[binary]>=3.1",
  "pyyaml>=6",
  "typer>=0.12",
  "rich>=13",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
releasecompat = "releasecompat.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
